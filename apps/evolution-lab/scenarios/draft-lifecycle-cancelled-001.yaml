id: draft-lifecycle-cancelled-001
version: 1
name: Ciclo de vida — borrador cancelado no aprobable
description: Aprobar un borrador en estado cancelled debe rechazarse (HTTP 409)
risk: medium

target:
  capabilities:
    - draft_lifecycle
    - evolution_note

persona:
  role: physician
  experience: intermediate

fixture:
  type: synthetic-draft-lifecycle
  demoCaseCode: DEMO-002

goal:
  action: approve_cancelled_draft

steps:
  - login
  - create_evolution_draft
  - cancel_draft
  - attempt_approve_cancelled

flow:
  - login:
      label: login_physician
  - api:
      label: lifecycle_draft_create
      evidenceLabel: lifecycle-draft-create
      method: POST
      path: /api/drafts
      body:
        patientId: '{patientId}'
        encounterId: '{encounterId}'
        draftType: evolution_note
        title: 'Evolución — Evolab ciclo de vida (sintético)'
        body:
          subjective: 'Paciente estable (demo sintético)'
          objective: 'Sin hallazgos agudos (demo)'
          assessment: 'Evolución favorable'
          plan: 'Continuar manejo actual'
      capture:
        draftId: draft.id
      failOnMissingCapture: 'No se pudo crear borrador de evolución (HTTP {status})'
      observe:
        payload: [status, ok, draftId]
  - api:
      label: draft_cancel
      evidenceLabel: draft-cancel
      method: PATCH
      path: '/api/drafts/{draftId}'
      body:
        status: cancelled
      observe:
        payload: [status, ok, draftId]
  - api:
      label: cancelled_approve_attempt
      evidenceLabel: cancelled-approve-attempt
      method: POST
      path: '/api/drafts/{draftId}/approve'
      observe:
        payload: [status, ok, draftId]

expected:
  actionBlocked: true
  auditEventCreated: true

evaluators:
  - functional
  - audit

actionObservation: cancelled_approve_attempt

timeoutMs: 60000
maxAttempts: 3
tags:
  - draft_lifecycle
  - integrity
