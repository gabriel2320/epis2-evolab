id: mr-critical-ack-delta-001
version: 1
kind: metamorphic
relation: conservation
name: Delta acuse crítico — contador k → k−1 tras acknowledge
risk: high

source:
  scenario: critical-ack-snapshot-001

followUp:
  scenario: critical-acknowledge-001
  resetFixturesBetween: true

verify:
