id: role-evolution-sign-001
version: 1
name: Acción fuera del rol — firma evolución médica
description: Usuario administrativo no puede firmar/aprobar evolución médica
risk: medium

target:
  capabilities:
    - rbac
    - evolution_note
    - draft_approval

persona:
  role: admin
  experience: novice

fixture:
  type: synthetic-draft-review
  demoCaseCode: DEMO-002
  draftId: d0000001-0000-4000-8000-000000000001
  draftStatus: ready_for_review

goal:
  action: sign_evolution_note

steps:
  - login_admin
  - open_patient
  - open_evolution_draft
  - attempt_approve_or_sign

# YAML v2 — pasos ejecutables por step-engine (paridad con ejecutor TS golden)
flow:
  - login:
      label: login_admin
  - browser:
      open: /comando
  - browser:
      open: '/espacio/ficha?patientId={patientId}'
      screenshot: 01-patient-workspace
  - browser:
      open: '/espacio/borrador/{draftId}'
      waitTestId: epis2-draft-review
      waitTimeoutMs: 20000
      waitAs: draftReviewVisible
      visible:
        forbiddenVisible: epis2-forbidden
        approveButtonVisible:
          testId: epis2-draft-approve
          ifKey: draftReviewVisible
      screenshot: 02-draft-review-admin
      label: draft_review_dom
      payload:
        draftId: '{draftId}'
  - api:
      label: approve_attempt
      evidenceLabel: approve-attempt
      method: POST
      path: '/api/drafts/{draftId}/approve'

expected:
  actionBlocked: true
  permissionDeniedVisible: true
  auditEventCreated: true

evaluators:
  - role_permission
  - functional
  - audit

timeoutMs: 90000
maxAttempts: 3
tags:
  - rbac
  - permissions
  - evolution
