  action: acknowledge_critical

steps:
  - login
  - acknowledge_critical
  - snapshot_criticals

flow:
  - login:
      label: login_physician
  - api:
      label: critical_ack_attempt
      evidenceLabel: critical-acknowledge
      method: POST
      path: '/api/inpatient/critical-results/{criticalResultId}/acknowledge'
      body: {}
      observe:
        payload: [status, ok]
  - custom:
      name: service_criticals
      args: { label: critical_count }

expected:
  acknowledgeSucceeded: true
  auditEventCreated: true

evaluators:
  - functional
  - audit_completeness

timeoutMs: 90000
maxAttempts: 2
tags:
  - critical
  - inpatient
  - metamorphic
