id: suspended-medication-mar-001
version: 1
name: MAR — medicamento suspendido no administrable
description: Enfermería no debe registrar administración de medicamento suspendido
risk: high

target:
  capabilities:
    - mar
    - nursing
    - medication_administration

persona:
  role: nurse
  experience: intermediate

fixture:
  type: synthetic-mar-suspended
  demoCaseCode: DEMO-005
  marDoseId: f1000001-0000-4000-8000-000000000001
  medicationHint: Warfarina
  medicationStatus: suspended
  marDoseHeld: true

goal:
  action: register_mar_administration

steps:
  - login_nurse
  - open_patient
  - open_nursing_mar
  - attempt_register_suspended_medication

# YAML v2 — pasos ejecutables por step-engine (paridad con ejecutor TS golden)
flow:
  - login:
      label: login_nurse
  - custom:
      name: mar_dashboard
      args: { label: scheduled_mar }
  - custom:
      name: mar_alerts
      args: { label: mar_alerts }
  - custom:
      name: mar_create_and_approve

expected:
  administrationBlocked: true
  warningVisible: true
  auditEventCreated: true

evaluators:
  - functional
  - mar_safety
  - audit

actionObservation: mar_approve_attempt

timeoutMs: 90000
maxAttempts: 3
tags:
  - mar
  - medication
  - nursing
